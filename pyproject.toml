[project]
name = "thesis"
version = "0.1.0"
description = "Context-Aware HRV Anomaly Detection with Chronos-2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting>=1.4.0",
    "neurokit2>=0.2.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
